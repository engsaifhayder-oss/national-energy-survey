<style>
:root{
  --g:#00361F; --g2:#0B4D2E; --lime:#97D214; --bg:#F3F6F2; --card:#fff;
  --ink:#16231B; --muted:#6B7A70; --line:#DCE4DD; --err:#C62828;
  --font:'Cairo',Tahoma,'Segoe UI','Noto Sans Arabic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--g);
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.05)}
header.top img{height:40px}
header.top .tag{background:var(--g);color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:18px 16px 22px;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:21px;font-weight:800}
.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
.hero>*{position:relative;z-index:1}
.hero:after{content:"";position:absolute;left:-24px;top:0;bottom:0;width:70px;background:var(--lime);transform:skewX(-20deg)}
.hero:before{content:"";position:absolute;left:58px;top:0;bottom:0;width:14px;background:rgba(151,210,20,.35);transform:skewX(-20deg)}
.hero{padding-left:96px}
.hero .no{display:inline-block;margin-top:10px;background:rgba(255,255,255,.14);padding:3px 10px;border-radius:8px;font-size:13px}
main{max-width:720px;margin:0 auto;padding:14px 12px 120px}
.card{background:var(--card);border-radius:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line);overflow:hidden}
.card>h2{margin:0;padding:13px 16px;font-size:17px;font-weight:800;color:var(--g);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#FAFCF9}
.card>h2 .n{width:28px;height:28px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.card>h2 .n.l{background:var(--lime);color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px;padding:14px 16px 16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:14px;font-weight:700;color:#334}
.f label .req{color:var(--err)}
.f input,.f textarea{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);width:100%;outline:none;transition:border .15s}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(151,210,20,.25)}
.f.bad input{border-color:var(--err)}
.unit{position:relative}
.unit input{padding-left:46px}
.unit span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-size:15px;font-weight:600;color:#334;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.chip.on:before{content:"✓ ";color:var(--lime)}
.gps{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gps small{color:var(--muted);direction:ltr}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--g);color:#fff}
.btn.lime{background:var(--lime);color:var(--g)}
.btn.ghost{background:#EEF3EE;color:var(--g)}
.btn.danger{background:#FDECEC;color:var(--err)}
.btn:active{transform:scale(.98)}
.photos{padding:14px 16px 16px;display:flex;flex-direction:column;gap:16px}
.pcat{border:1px dashed #C9D6CB;border-radius:14px;padding:12px}
.pcat .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pcat .hd b{font-size:15px}
.pcat .hd .cnt{font-size:12px;color:var(--muted);font-weight:600}
.pbtns{display:flex;gap:8px}
.pbtns .btn{flex:1;padding:10px 8px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumbs:empty{display:none}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:5px;left:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.sigwrap{padding:14px 16px 16px}
.sig{width:100%;height:170px;border:1.5px dashed #B9C8BC;border-radius:12px;background:#fff;touch-action:none;display:block}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:13px}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bar .btn{flex:1;padding:14px}
.bar .btn.pri{flex:2.2;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,20,10,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:22px 20px;text-align:center}
.box h3{margin:6px 0 6px;color:var(--g);font-size:19px}
.box p{margin:0 0 16px;color:#455;font-size:15px;line-height:1.7}
.box .acts{display:flex;flex-direction:column;gap:9px}
.spin{width:44px;height:44px;border:5px solid #E3EBE4;border-top-color:var(--lime);border-radius:50%;animation:s 1s linear infinite;margin:6px auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.ok{width:56px;height:56px;border-radius:50%;background:var(--lime);color:var(--g);display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#1F2A22;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
footer.inf{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:6px 0 10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}.f.half-sm{grid-column:auto}}
</style>
</head>

/* ---------- الحالة ---------- */
let S = blank();
function blank(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return { v:{date:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`},
    photos:{roof:[],place:[],board:[],other:[]}, sig:null,
    no:`NE-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}` };
}

/* ---------- حفظ المسودة (IndexedDB) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('ne-survey',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}})},
  async get(k){try{const db=await this.open();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}},
  async set(k,v){try{const db=await this.open();db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
};
let saveT; function save(){clearTimeout(saveT);saveT=setTimeout(()=>DB.set('draft',S),400)}

/* ---------- بناء الواجهة ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderForm(){
  let h='', n=0;
  for(const sec of SECTIONS){
    const num = sec.id==='info' ? '<span class="n l">i</span>' : `<span class="n">${++n}</span>`;
    h+=`<section class="card"><h2>${num}${sec.title}</h2><div class="grid">`;
    for(const f of sec.fields){
      const val=S.v[f.k]??'';
      const cls='f'+(f.full?' full':'');
      const lab=`<label for="i_${f.k}">${f.l}${f.req?' <span class="req">*</span>':''}</label>`;
      const ds=f.showIf?` data-show="${f.showIf[0]}|${f.showIf[1]}"`:'';
      if(f.t==='choice'){
        h+=`<div class="${cls}"${ds}><label>${f.l}</label><div class="chips" data-k="${f.k}">`+
          f.o.map(o=>`<button type="button" class="chip${val===o?' on':''}" data-v="${esc(o)}">${o}</button>`).join('')+`</div></div>`;
      }else if(f.t==='textarea'){
        h+=`<div class="${cls}"${ds}>${lab}<textarea id="i_${f.k}" data-k="${f.k}" placeholder="${f.ph||''}">${esc(val)}</textarea></div>`;
      }else if(f.t==='gps'){
        h+=`<div class="${cls}"><label>${f.l}</label><div class="gps"><button type="button" class="btn ghost" id="gpsBtn">📍 تحديد الموقع الحالي</button><small id="gpsTxt">${esc(val)}</small></div></div>`;
      }else{
        const type=f.t==='number'?'text':f.t, im=f.t==='number'?' inputmode="decimal"':(f.t==='tel'?' inputmode="tel"':'');
        const inp=`<input id="i_${f.k}" data-k="${f.k}" type="${type}"${im} value="${esc(val)}" placeholder="${f.ph||''}">`;
        h+=`<div class="${cls}"${ds}>${lab}${f.u?`<div class="unit">${inp}<span>${f.u}</span></div>`:inp}</div>`;
      }
    }
    h+='</div></section>';
  }
  $('#frm').innerHTML=h;
  applyShowIf();
  $('#repNo').textContent='رقم التقرير: '+S.no;
}

function compress(file,max=1600,q=.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img; const r=Math.min(1,max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej()}; img.src=url;
  });
}

const sig=$('#sig'), sx=sig.getContext('2d'); let drawing=false, sigDirty=false;
function sizeSig(){
  const r=sig.getBoundingClientRect(), d=window.devicePixelRatio||1;
  sig.width=r.width*d; sig.height=r.height*d; sx.setTransform(d,0,0,d,0,0);
  sx.lineWidth=2.6; sx.lineCap='round'; sx.lineJoin='round'; sx.strokeStyle='#0A2A6B';
  if(S.sig){const i=new Image();i.onload=()=>sx.drawImage(i,0,0,r.width,r.height);i.src=S.sig}
}
const pt=e=>{const r=sig.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
sig.addEventListener('pointerdown',e=>{drawing=true;sig.setPointerCapture(e.pointerId);const[x,y]=pt(e);sx.beginPath();sx.moveTo(x,y)});
sig.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pt(e);sx.lineTo(x,y);sx.stroke();sigDirty=true});
const endSig=()=>{if(!drawing)return;drawing=false;if(sigDirty){S.sig=sig.toDataURL('image/png');save()}};
sig.addEventListener('pointerup',endSig); sig.addEventListener('pointercancel',endSig);
$('#sigClr').onclick=()=>{S.sig=null;sigDirty=false;sx.clearRect(0,0,sig.width,sig.height);save()};

/* ================================================================
   مولّد الـ PDF (بدون مكتبات خارجية – يعمل بدون إنترنت)
   كل صفحة تُرسم على Canvas بدقة A4 ثم تُضمَّن كصورة JPEG
   ================================================================ */
const W=1240, H=1754, M=70, SC=1.5;      // A4 @150dpi × 1.5
const FONT="Cairo, Tahoma, 'Segoe UI', 'Noto Sans Arabic', sans-serif";
const C={g:'#00361F',g2:'#0B4D2E',lime:'#97D214',ink:'#17241C',mut:'#6B7A70',line:'#D5DFD7',soft:'#F4F8F3'};
const loadImg=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
function rr(x,c,y,w,h,r){x.beginPath();x.moveTo(c+r,y);x.arcTo(c+w,y,c+w,y+h,r);x.arcTo(c+w,y+h,c,y+h,r);x.arcTo(c,y+h,c,y,r);x.arcTo(c,y,c+w,y,r);x.closePath()}
function fnt(x,sz,w=400){x.font=`${w} ${sz}px ${FONT}`}
function wrap(x,text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    const words=para.split(/\s+/); let line='';
    for(const w of words){
      const t=line?line+' '+w:w;
      if(x.measureText(t).width>maxW && line){out.push(line);line=w}else line=t;
    }
    out.push(line);
  }
  return out;
}
function fmtDate(s){if(!s)return'—';const[y,m,d]=s.split('-');return `${y}/${+m}/${+d}`}

async function buildReport(){
  const logo=await loadImg(LOGO);
  const pages=[]; let x, y;
  const TOP=245, BOT=H-170, CW=W-2*M;

  function newPage(){
    const cv=document.createElement('canvas'); cv.width=W*SC; cv.height=H*SC;
    x=cv.getContext('2d'); x.scale(SC,SC); x.direction='rtl'; x.textBaseline='alphabetic';
    x.fillStyle='#fff'; x.fillRect(0,0,W,H);
    // الترويسة
    const lw=430, lh=lw*logo.height/logo.width;
    x.drawImage(logo,W-M-lw,58,lw,lh);
    fnt(x,40,800); x.fillStyle=C.g; x.textAlign='left'; x.direction='rtl';
    x.fillText('تقرير كشف موقعي',M,100);
    fnt(x,22,600); x.fillStyle=C.mut;
    x.fillText('رقم التقرير: '+S.no,M,140);
    x.fillText('تاريخ الكشف: '+fmtDate(S.v.date),M,172);
    x.fillStyle=C.g; x.fillRect(M,200,CW,5);
    x.fillStyle=C.lime; x.fillRect(W-M-180,200,180,5);
    pages.push(cv); y=TOP;
  }
  function ensure(h){ if(y+h>BOT) newPage(); }

  function sectionBar(title,num,need=0){
    ensure(74+(need||60));
    const h=58; rr(x,M,y,CW,h,12); x.fillStyle=C.g; x.fill();
    x.fillStyle=C.lime; rr(x,W-M-58,y,58,h,12); x.fill(); x.fillRect(W-M-58,y,20,h);
    fnt(x,28,800); x.textAlign='center'; x.fillStyle=C.g; x.fillText(num,W-M-29,y+39);
    x.textAlign='right'; x.fillStyle='#fff'; x.fillText(title,W-M-78,y+39);
    y+=h+16;
  }

  // قياس ورسم خلية (عنوان + قيمة)
  function cellHeight(f,w){
    if(f.t==='choice') return 104;
    fnt(x,27,700); const lines=wrap(x,valueOf(f),w-40);
    return 62+lines.length*40;
  }
  function valueOf(f){
    let v=String(S.v[f.k]??'').trim(); if(!v) return '—';
    if(f.t==='date') return fmtDate(v);
    if(f.u) v+=' '+f.u;
    return v;
  }
  function drawCell(f,cx,cy,w,h){
    rr(x,cx,cy,w,h,12); x.fillStyle=C.soft; x.fill(); x.strokeStyle=C.line; x.lineWidth=1.5; x.stroke();
    x.fillStyle=C.lime; x.fillRect(cx+w-6,cy+14,6,h-28);
    fnt(x,21,600); x.fillStyle=C.mut; x.textAlign='right'; x.fillText(f.l,cx+w-22,cy+38);
    if(f.t==='choice'){
      let px=cx+w-22; const by=cy+58, sel=S.v[f.k];
      for(const o of f.o){
        const on=o===sel; const bs=28;
        rr(x,px-bs,by,bs,bs,6); x.fillStyle=on?C.g:'#fff'; x.fill(); x.strokeStyle=on?C.g:'#9AA89E'; x.lineWidth=2; x.stroke();
        if(on){x.strokeStyle=C.lime;x.lineWidth=4;x.beginPath();x.moveTo(px-bs+6,by+15);x.lineTo(px-bs+12,by+21);x.lineTo(px-6,by+8);x.stroke()}
        fnt(x,25,on?800:500); x.fillStyle=on?C.g:C.ink; x.textAlign='right';
        x.fillText(o,px-bs-10,by+23);
        px-= bs+10+x.measureText(o).width+40;
      }
    }else{
      fnt(x,27,700); x.fillStyle=C.ink; x.textAlign='right';
      wrap(x,valueOf(f),w-40).forEach((ln,i)=>x.fillText(ln,cx+w-22,cy+80+i*40));
    }
  }
  function grid(fields,title,num){
    const visible=fields.filter(f=>f.t!=='gps'||S.v.gps).filter(f=>!f.showIf||S.v[f.showIf[0]]===f.showIf[1]);
    const gap=16, half=(CW-gap)/2; let row=[];
    const rows=[]; for(const f of visible){
      const full=f.full||f.t==='textarea';
      if(full){ if(row.length)rows.push(row),row=[]; rows.push([f]); }
      else { row.push(f); if(row.length===2)rows.push(row),row=[]; }
    }
    if(row.length)rows.push(row);
    const rh=r=>{const w=r.length===1&&(r[0].full||r[0].t==='textarea')?CW:half;fnt(x,27,700);return Math.max(...r.map(f=>cellHeight(f,w)))};
    sectionBar(title,num,rows.length?rh(rows[0])+gap:0);
    for(const r of rows){
      const w=r.length===1&&(r[0].full||r[0].t==='textarea')?CW:half;
      fnt(x,27,700);
      const h=Math.max(...r.map(f=>cellHeight(f,w)));
      ensure(h+gap);
      r.forEach((f,i)=>drawCell(f,W-M-w-i*(w+gap),y,w,h));
      y+=h+gap;
    }
    y+=10;
  }

  /* الصفحة الأولى */
  newPage();
  // شريط عنوان النموذج
  rr(x,M,y,CW,72,14); const gr=x.createLinearGradient(M,0,W-M,0); gr.addColorStop(0,C.g2); gr.addColorStop(1,C.g); x.fillStyle=gr; x.fill();
  x.save(); rr(x,M,y,CW,72,14); x.clip(); x.fillStyle=C.lime; x.beginPath(); x.moveTo(M,y);x.lineTo(M+90,y);x.lineTo(M+50,y+72);x.lineTo(M,y+72);x.fill(); x.restore();
  fnt(x,32,800); x.fillStyle='#fff'; x.textAlign='center'; x.fillText('نموذج كشف موقعي للوحدة السكنية',W/2,y+47);
  y+=100;

  let n=0;
  for(const sec of SECTIONS){
    grid(sec.fields, sec.title, sec.id==='info'?'i':String(++n));
  }

  // التواقيع
  ensure(260);
  y+=6; const sw=(CW-16)/2;
  for(const [i,t] of [['0','توقيع المهندس / الوكيل'],['1','توقيع الزبون']]){
    const cx=W-M-sw-(+i)*(sw+16);
    rr(x,cx,y,sw,220,12); x.strokeStyle=C.line; x.lineWidth=1.5; x.stroke();
    fnt(x,22,700); x.fillStyle=C.g; x.textAlign='right'; x.fillText(t,cx+sw-20,y+38);
    fnt(x,22,600); x.fillStyle=C.ink; x.fillText(i==='0'?(S.v.engineer||''):(S.v.customer||''),cx+sw-20,y+200);
    x.strokeStyle='#B8C4BB'; x.setLineDash([6,6]); x.beginPath(); x.moveTo(cx+20,y+165); x.lineTo(cx+sw-20,y+165); x.stroke(); x.setLineDash([]);
    if(i==='0'&&S.sig){ const si=await loadImg(S.sig); const bh=110, bw=Math.min(sw-40,bh*si.width/si.height); x.drawImage(si,cx+(sw-bw)/2,y+50,bw,bh); }
  }
  y+=240;

  /* صفحات الصور */
  const cats=PHOTO_CATS.filter(c=>S.photos[c.k].length);
  for(const c of cats){
    const list=S.photos[c.k];
    newPage();
    sectionBar(c.l,'✓');
    const avail=BOT-y;
    for(let i=0;i<list.length;i++){
      const img=await loadImg(list[i]);
      const per=list.length===1?1:2;
      const boxH=(avail-(per-1)*24)/per;
      if(i>0 && i%per===0){ newPage(); sectionBar(c.l+' (تابع)','✓'); }
      const bx=M, by=y;
      rr(x,bx,by,CW,boxH,14); x.fillStyle=C.soft; x.fill(); x.strokeStyle=C.line; x.lineWidth=1.5; x.stroke();
      const capH=50, iw=CW-30, ih=boxH-30-capH;
      const r=Math.min(iw/img.width, ih/img.height), dw=img.width*r, dh=img.height*r;
      x.save(); rr(x,bx+15+(iw-dw)/2,by+15+(ih-dh)/2,dw,dh,8); x.clip();
      x.drawImage(img,bx+15+(iw-dw)/2,by+15+(ih-dh)/2,dw,dh); x.restore();
      fnt(x,22,700); x.fillStyle=C.g; x.textAlign='center';
      x.fillText(`${c.l.replace('صور','صورة')} – ${i+1} من ${list.length}`,W/2,by+boxH-22);
      y+=boxH+24;
    }
  }

  /* التذييل وأرقام الصفحات لكل الصفحات */
  pages.forEach((cv,i)=>{
    const g=cv.getContext('2d'); g.setTransform(SC,0,0,SC,0,0); g.direction='rtl';
    const fy=H-120;
    g.fillStyle=C.g; g.fillRect(0,fy,W,120);
    g.fillStyle=C.lime; g.beginPath(); g.moveTo(0,fy);g.lineTo(150,fy);g.lineTo(110,H);g.lineTo(0,H);g.fill();
    g.fillStyle=C.g2; g.beginPath(); g.moveTo(165,fy);g.lineTo(195,fy);g.lineTo(155,H);g.lineTo(125,H);g.fill();
    fnt(g,26,800); g.fillStyle='#fff'; g.textAlign='right'; g.fillText(CO.name,W-M,fy+48);
    fnt(g,21,500); g.fillStyle='#CFE3D5'; g.fillText('العنوان: '+CO.addr,W-M,fy+86);
    fnt(g,30,800); g.fillStyle=C.lime; g.textAlign='left'; g.direction='ltr'; g.fillText(CO.phone,230,fy+56);
    fnt(g,18,500); g.fillStyle='#CFE3D5'; g.direction='rtl'; g.fillText('للتواصل',230,fy+88);
    fnt(g,19,600); g.fillStyle=C.mut; g.textAlign='center'; g.fillText(`صفحة ${i+1} من ${pages.length}`,W/2,fy-22);
  });
  return pages;
}

/* كاتب PDF بسيط يضمّن صور JPEG */
function makePdf(pages){
  const enc=new TextEncoder(), chunks=[], offs=[]; let len=0;
  const put=d=>{const b=typeof d==='string'?enc.encode(d):d;chunks.push(b);len+=b.length};
  const PW=595.28, PH=841.89, N=pages.length;
  put('%PDF-1.4\n');
  const obj=(id,body)=>{offs[id]=len;put(`${id} 0 obj\n`);body();put('\nendobj\n')};
  const kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>put(`<< /Type /Pages /Kids [${kids}] /Count ${N} >>`));
  pages.forEach((cv,i)=>{
    const p=3+i*3, cId=p+1, iId=p+2;
    const b64=cv.toDataURL('image/jpeg',.86).split(',')[1], bin=atob(b64), jpg=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++)jpg[k]=bin.charCodeAt(k);
    const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(p,()=>put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iId} 0 R >> >> /Contents ${cId} 0 R >>`));
    obj(cId,()=>put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(iId,()=>{put(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);put(jpg);put('\nendstream')});
  });
  const total=3+N*3, xref=len;
  let t=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++) t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  t+=`trailer\n<< /Size ${total} /Root 1 0 R /Info << /Producer (National Energy Survey App) >> >>\nstartxref\n${xref}\n%%EOF`;
  put(t);
  return new Blob(chunks,{type:'application/pdf'});
}

/* ---------- إنشاء وحفظ ---------- */
let lastPdf=null;
$('#btnPdf').onclick=async()=>{
  const miss=validate();
  if(miss.length){
    modal(`<h3>بيانات ناقصة</h3><p>يرجى إكمال:<br><b>${miss.map(esc).join('<br>')}</b></p><div class="acts"><button class="btn pri" id="mOk">حسناً</button></div>`);
    $('#mOk').onclick=()=>{closeModal();document.querySelector('.f.bad input')?.focus()}; return;
  }
  modal(`<div class="spin"></div><h3>جارٍ إنشاء التقرير…</h3><p>يرجى الانتظار لحظات</p>`);
  try{
    try{ await Promise.race([document.fonts.load(`700 20px Cairo`),new Promise(r=>setTimeout(r,2500))]); await document.fonts.ready; }catch(_){}
    const pages=await buildReport();
    const blob=makePdf(pages);
    const safe=s=>String(s||'').trim().replace(/[\\/:*?"<>|\s]+/g,'_');
    const name=`كشف_${safe(S.v.customer)}_${(S.v.date||'').replace(/-/g,'')}.pdf`;
    lastPdf={blob,name};
    download();
    const canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:'application/pdf'})]}));
    modal(`<div class="ok">✓</div><h3>تم حفظ التقرير</h3><p>تم حفظ الملف في مجلد التنزيلات (Downloads) على جهازك:<br><b style="font-size:13px">${esc(name)}</b><br><span style="font-size:13px;color:#6B7A70">${pages.length} صفحة · ${(blob.size/1048576).toFixed(1)} MB</span></p>
      <div class="acts">
        ${canShare?'<button class="btn lime" id="mShare">مشاركة التقرير (واتساب / بريد…)</button>':''}
        <button class="btn ghost" id="mOpen">فتح التقرير</button>
        <button class="btn ghost" id="mAgain">تنزيل مرة أخرى</button>
        <button class="btn pri" id="mClose">إغلاق</button>
      </div>`);
    $('#mClose').onclick=closeModal; $('#mAgain').onclick=download;
    $('#mOpen').onclick=()=>{const u=URL.createObjectURL(lastPdf.blob);const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)};
    if(canShare)$('#mShare').onclick=async()=>{try{await navigator.share({files:[new File([lastPdf.blob],lastPdf.name,{type:'application/pdf'})],title:lastPdf.name})}catch(_){}};
  }catch(err){
    console.error(err);
    modal(`<h3>حدث خطأ</h3><p>تعذّر إنشاء التقرير. حاول مرة أخرى أو قلّل عدد الصور.</p><div class="acts"><button class="btn pri" id="mClose">إغلاق</button></div>`);
    $('#mClose').onclick=closeModal;
  }
};
function download(){
  if(!lastPdf)return;
  const u=URL.createObjectURL(lastPdf.blob), a=document.createElement('a');
  a.href=u; a.download=lastPdf.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}

$('#btnNew').onclick=()=>{
  modal(`<h3>بدء تقرير جديد؟</h3><p>سيتم مسح جميع البيانات والصور الحالية.</p><div class="acts"><button class="btn danger" id="mYes">نعم، ابدأ تقريراً جديداً</button><button class="btn ghost" id="mNo">إلغاء</button></div>`);
  $('#mNo').onclick=closeModal;
  $('#mYes').onclick=()=>{S=blank();lastPdf=null;renderForm();renderPhotos();S.sig=null;sx.clearRect(0,0,sig.width,sig.height);save();closeModal();scrollTo({top:0,behavior:'smooth'})};
};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!$('#mbox .spin'))closeModal()});

(async()=>{
  const d=await DB.get('draft');
  if(d&&d.v&&d.photos){S=d; for(const c of PHOTO_CATS) S.photos[c.k]=S.photos[c.k]||[];}
  renderForm(); renderPhotos(); sizeSig();
  if(d&&d.v&&Object.keys(d.v).length>1) toast('تمت استعادة آخر مسودة غير محفوظة');
})();
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(sizeSig,200)});
})();
