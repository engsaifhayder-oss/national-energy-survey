<title>تطبيق الكشف – الطاقة الوطنية</title>
<style>
:root{
  --dk:#002816; --dk2:#0b4a2c; --lime:#97d214; --bg:#f3f6f2; --card:#fff;
  --ink:#14231b; --mut:#5f6f66; --line:#dfe6e0; --err:#c0392b;
  --f:"Cairo","Noto Kufi Arabic","Noto Sans Arabic","Segoe UI","SF Arabic",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px}
header{background:#fff;border-bottom:4px solid var(--dk);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
header .in{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header img{height:42px}
header .tag{background:var(--dk);color:#fff;font-size:13px;padding:6px 12px;border-radius:20px;border-inline-start:4px solid var(--lime)}
main{max-width:720px;margin:auto;padding:14px 12px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.card h2{margin:0;font-size:16px;padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.card h2 .n{width:26px;height:26px;border-radius:8px;background:var(--dk);color:var(--lime);display:grid;place-items:center;font-size:14px}
.body{padding:12px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid #cfd8d1;border-radius:10px;background:#fbfdfb;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--lime);border-color:var(--dk2)}
textarea{min-height:90px;resize:vertical}
.req::after{content:" *";color:var(--err)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fcfefb}
.item .t{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--dk2)}
.item .g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item input{padding:8px 9px;font-size:15px}
.pbtns{display:flex;gap:8px;margin-bottom:10px}
.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.cam{background:var(--dk);color:#fff;flex:1}
.btn.gal{background:#e8efe9;color:var(--dk);flex:1}
.btn.pri{background:var(--lime);color:var(--dk);font-weight:700;flex:2}
.btn.sec{background:#fff;color:var(--dk);border:1px solid #cfd8d1;flex:1}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e7ece8}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:5px;left:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:28px;padding:0}
.th span{position:absolute;bottom:4px;right:6px;background:rgba(0,40,22,.8);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:14px;border:1px dashed #cfd8d1;border-radius:10px}
.cnt{margin-inline-start:auto;font-size:12px;color:var(--mut);font-weight:400}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:720px;margin:auto;display:flex;gap:8px}
.hidden{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,20,10,.55);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:18px}
.dlg h3{margin:0 0 8px;font-size:18px;color:var(--dk)}
.dlg p{margin:0 0 14px;color:var(--mut);font-size:14px;line-height:1.7}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap}
.spin{width:38px;height:38px;border:4px solid #e3ebe5;border-top-color:var(--lime);border-radius:50%;animation:s 1s linear infinite;margin:6px auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.foot{text-align:center;color:var(--mut);font-size:12px;line-height:1.8;margin-top:6px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>

function readItems(){return [...itemsEl.children].map(d=>{const o={name:d.dataset.name};d.querySelectorAll("input").forEach(x=>o[x.dataset.k]=x.value.trim());return o;});}

function saveDraft(){try{const o={};FIELDS.forEach(f=>o[f]=$(f).value);o.items=readItems();localStorage.setItem("ne_draft",JSON.stringify(o));}catch(e){}}
function loadDraft(){try{const o=JSON.parse(localStorage.getItem("ne_draft")||"null");if(!o)return;FIELDS.forEach(f=>{if(o[f]!=null)$(f).value=o[f];});(o.items||[]).forEach((it,i)=>{const d=itemsEl.children[i];if(!d)return;d.querySelectorAll("input").forEach(x=>x.value=it[x.dataset.k]||"");});}catch(e){}}
document.addEventListener("input",saveDraft);
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ---------- photos ---------- */
let curSec=null;
function renderSec(k){
  const el=document.querySelector(`[data-sec="${k}"]`),arr=photos[k];
  document.querySelector(`[data-c="${k}"]`).textContent=arr.length?arr.length+" صورة":"";
  el.innerHTML=`<div class="pbtns"><button class="btn cam" data-a="cam">📷 التقاط صورة</button><button class="btn gal" data-a="gal">🖼️ من المعرض</button></div>`+
   (arr.length?`<div class="thumbs">${arr.map((p,i)=>`<div class="th"><img src="${p.thumb}"><button data-del="${i}" aria-label="حذف">×</button><span>${i+1}</span></div>`).join("")}</div>`:`<div class="empty">لم تُضف صور بعد</div>`);
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    curSec=k;const f=b.dataset.a=="cam"?$("fCam"):$("fGal");f.value="";f.click();});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.del,1);renderSec(k);});
}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function addFiles(files){
  const k=curSec;if(!k)return;
  for(const f of files){
    try{
      const url=URL.createObjectURL(f);const im=await loadImg(url);URL.revokeObjectURL(url);
      const M=1600,s=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      const t=document.createElement("canvas"),ts=240/Math.max(c.width,c.height);t.width=c.width*ts;t.height=c.height*ts;
      t.getContext("2d").drawImage(c,0,0,t.width,t.height);
      const jb=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));c.width=c.height=1;
      photos[k].push({blob:jb,w:Math.round(im.naturalWidth*s),h:Math.round(im.naturalHeight*s),thumb:t.toDataURL("image/jpeg",.7)});
    }catch(e){toast("تعذّر قراءة الصورة");}
  }
  renderSec(k);
}
$("fCam").onchange=e=>addFiles([...e.target.files]);
$("fGal").onchange=e=>addFiles([...e.target.files]);
Object.keys(SECS).forEach(renderSec);

/* ---------- ui helpers ---------- */
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function dialog(html){$("dlg").innerHTML=html;$("ov").classList.remove("hidden");}
function closeDlg(){$("ov").classList.add("hidden");}

/* ---------- canvas page drawing ---------- */
const PW=1240,PH=1754; // A4 @150dpi
let logoImg=null;
function F(sz,b){return (b?"700 ":"400 ")+sz+"px "+FONT;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(c,s,x,y,o={}){c.font=F(o.size||26,o.bold);c.fillStyle=o.color||"#14231b";c.direction=o.dir||"rtl";c.textAlign=o.align||"right";c.textBaseline=o.base||"middle";c.fillText(s,x,y);}
function wrap(c,s,maxW,size,bold){c.font=F(size,bold);c.direction="rtl";const out=[];String(s).split(/\n/).forEach(par=>{let line="";par.split(/\s+/).forEach(w=>{const tst=line?line+" "+w:w;if(c.measureText(tst).width>maxW&&line){out.push(line);line=w;}else line=tst;});out.push(line);});return out;}
function fit(c,s,maxW,size,bold){c.font=F(size,bold);if(c.measureText(s).width<=maxW)return s;while(s.length>1&&c.measureText(s+"…").width>maxW)s=s.slice(0,-1);return s+"…";}

function newPage(title,pageNo,total){
  const cv=document.createElement("canvas");cv.width=PW;cv.height=PH;const c=cv.getContext("2d");
  c.fillStyle="#fff";c.fillRect(0,0,PW,PH);
  // header
  c.fillStyle="#fff";c.fillRect(0,0,PW,170);
  c.fillStyle="#002816";c.fillRect(0,170,PW,8);c.fillStyle="#97d214";c.fillRect(0,178,PW,4);
  const lh=104,lw=logoImg.width*lh/logoImg.height;c.drawImage(logoImg,60,33,lw,lh);
  // title badge (right)
  c.font=F(38,true);const tw=c.measureText(title).width+90;
  c.fillStyle="#002816";c.beginPath();c.moveTo(PW,40);c.lineTo(PW-tw-30,40);c.lineTo(PW-tw,130);c.lineTo(PW,130);c.closePath();c.fill();
  c.fillStyle="#97d214";c.fillRect(PW-14,40,14,90);
  txt(c,title,PW-50,86,{size:38,bold:true,color:"#fff"});
  // footer
  const fy=PH-120;
  c.fillStyle="#97d214";c.fillRect(0,fy-4,PW,4);c.fillStyle="#002816";c.fillRect(0,fy,PW,120);
  txt(c,"📍 "+CO.addr,PW-60,fy+42,{size:24,color:"#fff"});
  txt(c,"☎ "+CO.phone,60,fy+42,{size:26,bold:true,color:"#fff",dir:"ltr",align:"left"});
  txt(c,CO.name,PW-60,fy+84,{size:20,color:"#a9c7b4"});
  txt(c,"صفحة "+pageNo+" من "+total,60,fy+84,{size:20,color:"#a9c7b4",align:"left"});
  return {cv,c};
}

function infoPage(d,pn,tot){
  const {cv,c}=newPage("تقرير كشف وتنفيذ",pn,tot);const R=PW-60,L=60,W=R-L;let y=225;
  // meta strip
  rr(c,L,y,W,74,14);c.fillStyle="#eef4ec";c.fill();
  txt(c,"التاريخ: ",R-24,y+37,{size:26,bold:true,color:"#0b4a2c"});
  c.font=F(26,true);let x=R-24-c.measureText("التاريخ: ").width;
  txt(c,d.date||"—",x,y+37,{size:26});
  txt(c,"رقم العقد: ",PW/2+40,y+37,{size:26,bold:true,color:"#0b4a2c"});
  c.font=F(26,true);x=PW/2+40-c.measureText("رقم العقد: ").width;txt(c,d.cno||"—",x,y+37,{size:26});
  y+=110;
  // section heading helper
  const head=(t)=>{c.fillStyle="#97d214";c.fillRect(R-8,y-20,8,40);txt(c,t,R-22,y,{size:30,bold:true,color:"#002816"});y+=40;};
  const kv=(k,v,x0,w)=>{c.strokeStyle="#dfe6e0";c.lineWidth=2;rr(c,x0,y,w,64,10);c.stroke();
    txt(c,k,x0+w-18,y+32,{size:22,color:"#5f6f66"});c.font=F(22);const kw=c.measureText(k).width+36;
    txt(c,fit(c,v||"—",w-kw-20,25,true),x0+w-kw,y+32,{size:25,bold:true});};
  head("معلومات الزبون");
  kv("الاسم الكامل:",d.cname,L,W);y+=78;
  const half=(W-16)/2;
  kv("رقم الهاتف:",d.cphone,L+half+16,half);kv("العنوان:",d.caddr,L,half);y+=78;
  kv("الموظف المنفذ:",d.emp,L+half+16,half);kv("سعة المنظومة الكلية:",d.cap,L,half);y+=110;
  head("تفاصيل المواد");
  // table
  const cols=[{t:"ت",w:60},{t:"اسم المادة",w:200},{t:"النوع / المواصفات",w:320},{t:"العدد",w:90},{t:"السعة",w:260},{t:"مدة الضمان",w:180}];
  const tot2=cols.reduce((a,b)=>a+b.w,0),sc=W/tot2;cols.forEach(cl=>cl.w*=sc);
  const rh=62;let cx=R;
  c.fillStyle="#002816";rr(c,L,y,W,rh,10);c.fill();
  cols.forEach(cl=>{txt(c,cl.t,cx-cl.w/2,y+rh/2,{size:22,bold:true,color:"#fff",align:"center"});cx-=cl.w;});y+=rh;
  d.items.forEach((it,i)=>{
    c.fillStyle=i%2?"#f6f9f5":"#fff";c.fillRect(L,y,W,rh);
    const vals=[String(i+1),it.name,it.spec,it.qty,it.capa,it.war];cx=R;
    vals.forEach((v,j)=>{const cl=cols[j];txt(c,fit(c,v||"—",cl.w-16,22,j==1),cx-cl.w/2,y+rh/2,{size:22,bold:j==1,align:"center",color:v?"#14231b":"#a0aca4"});cx-=cl.w;});
    c.strokeStyle="#e3e9e4";c.lineWidth=1.5;c.beginPath();c.moveTo(L,y+rh);c.lineTo(R,y+rh);c.stroke();y+=rh;});
  c.strokeStyle="#cfd8d1";c.lineWidth=2;rr(c,L,y-rh*(d.items.length+1),W,rh*(d.items.length+1),10);c.stroke();
  y+=60;
  head("الملاحظات");
  const lines=wrap(c,d.notes||"لا توجد ملاحظات.",W-48,24);const nh=Math.min(Math.max(lines.length*40+30,110),320);
  c.fillStyle="#fafcf9";rr(c,L,y,W,nh,12);c.fill();c.strokeStyle="#dfe6e0";c.stroke();
  lines.slice(0,Math.floor((nh-30)/40)).forEach((ln,i)=>txt(c,ln,R-24,y+35+i*40,{size:24}));
  y+=nh+50;
  // photo summary
  txt(c,"المرفقات: العقد ("+d.counts.contract+") · الألواح ("+d.counts.panels+") · الأجهزة ("+d.counts.devices+") · سيريال الانفرتر ("+d.counts.snInv+") · سيريال البطاريات ("+d.counts.snBat+")",R,y,{size:21,color:"#5f6f66"});
  // signatures
  const sy=PH-300;
  [["توقيع الموظف المنفذ",R-60],["توقيع الزبون",L+380]].forEach(([t,xx])=>{
    txt(c,t,xx,sy,{size:24,bold:true,color:"#0b4a2c"});
    c.strokeStyle="#9aa8a0";c.setLineDash([6,6]);c.lineWidth=2;c.beginPath();c.moveTo(xx,sy+80);c.lineTo(xx-320,sy+80);c.stroke();c.setLineDash([]);});
  return cv;
}

async function photoPage(title,list,startIdx,pn,tot,grid){
  const imgs=[];for(const p of list){const u=URL.createObjectURL(p.blob);imgs.push(await loadImg(u));URL.revokeObjectURL(u);}
  const {cv,c}=newPage(title,pn,tot);
  const top=215,bot=PH-150,L=60,W=PW-120,H=bot-top,g=24,n=list.length;
  let cells=[];
  if(grid&&n>1){const cw=(W-g)/2,rows=Math.ceil(n/2),ch=(H-g*(rows-1))/rows;for(let i=0;i<n;i++){const last=(i==n-1&&n%2==1);cells.push([last?L:L+(i%2==0?cw+g:0),top+Math.floor(i/2)*(ch+g),last?W:cw,ch]);}}
  else{const ch=(H-g*(n-1))/n;for(let i=0;i<n;i++)cells.push([L,top+i*(ch+g),W,ch]);}
  list.forEach((p,i)=>{const [x,y,w,h]=cells[i];
    c.save();rr(c,x,y,w,h,16);c.fillStyle="#eef2ef";c.fill();c.clip();
    const s=Math.min(w/p.w,h/p.h),dw=p.w*s,dh=p.h*s;c.drawImage(imgs[i],x+(w-dw)/2,y+(h-dh)/2,dw,dh);c.restore();
    c.strokeStyle="#cfd8d1";c.lineWidth=2;rr(c,x,y,w,h,16);c.stroke();
    const lb=String(startIdx+i+1);c.fillStyle="rgba(0,40,22,.85)";rr(c,x+w-70,y+14,56,40,10);c.fill();
    txt(c,lb,x+w-42,y+34,{size:22,bold:true,color:"#fff",align:"center"});});
  return cv;
}

/* ---------- minimal PDF writer (JPEG pages) ---------- */
function canvasJpeg(cv){return new Promise(r=>cv.toBlob(b=>b.arrayBuffer().then(a=>r(new Uint8Array(a))),"image/jpeg",.85));}
async function buildPdf(n,getPage){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const u=typeof x=="string"?enc.encode(x):x;parts.push(u);len+=u.length;};
  const pageW=595.28,pageH=841.89;
  // obj ids: 1 catalog, 2 pages, then per page: page(3+3i), content(4+3i), image(5+3i)
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const obj=(id,body)=>{offs[id]=len;push(id+" 0 obj\n");if(Array.isArray(body))body.forEach(push);else push(body);push("\nendobj\n");};
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Count "+n+" /Kids ["+Array.from({length:n},(_,i)=>(3+3*i)+" 0 R").join(" ")+"] >>");
  for(let i=0;i<n;i++){
    const cv=await getPage(i),jpg=await canvasJpeg(cv);
    const pid=3+3*i,cid=pid+1,iid=pid+2;
    obj(pid,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pageW+" "+pageH+"] /Resources << /XObject << /Im"+i+" "+iid+" 0 R >> >> /Contents "+cid+" 0 R >>");
    const cs="q "+pageW+" 0 0 "+pageH+" 0 0 cm /Im"+i+" Do Q";
    obj(cid,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
    obj(iid,["<< /Type /XObject /Subtype /Image /Width "+cv.width+" /Height "+cv.height+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n",jpg,"\nendstream"]);
    cv.width=cv.height=1;
  }
  const total=3+3*n,xref=len;let x="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(x+"trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}

/* ---------- generate ---------- */
function collect(){const d={};FIELDS.forEach(f=>d[f]=$(f).value.trim());d.items=readItems();d.counts={};Object.keys(SECS).forEach(k=>d.counts[k]=photos[k].length);return d;}
async function makeReport(){
  if(!logoImg)logoImg=await loadImg(LOGO);
  try{if(document.fonts){await Promise.all([document.fonts.load("400 24px Cairo"),document.fonts.load("700 24px Cairo")]);await document.fonts.ready;}}catch(e){}
  const d=collect(),chunks=[];
  Object.keys(SECS).forEach(k=>{const a=photos[k];if(!a.length)return;const portrait=a.filter(p=>p.h>p.w).length*2>=a.length;const per=portrait?4:3;
    for(let i=0;i<a.length;i+=per)chunks.push([SECS[k].t,a.slice(i,i+per),i,portrait]);});
  const tot=1+chunks.length;
  const blob=await buildPdf(tot,async i=>i==0?infoPage(d,1,tot):await photoPage(chunks[i-1][0],chunks[i-1][1],chunks[i-1][2],i+1,tot,chunks[i-1][3]));
  const safe=(d.cname||"زبون").replace(/[\\/:*?"<>|]+/g,"").replace(/\s+/g,"_").slice(0,40);
  return {blob,name:"تقرير_كشف_"+safe+"_"+(d.date||today())+".pdf"};
}
let lastPdf=null;
async function savePdf(){
  if(!lastPdf)return;
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:lastPdf.name,data:lastPdf.blob});closeDlg();toast("تم حفظ التقرير ✓");return;}
  }catch(e){if(e&&e.code=="declined"){toast("تم إلغاء الحفظ");return;}}
  try{const u=URL.createObjectURL(lastPdf.blob),a=document.createElement("a");a.href=u;a.download=lastPdf.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);closeDlg();toast("تم حفظ التقرير ✓");}
  catch(e){toast("تعذّر الحفظ على هذا الجهاز");}
}
$("pdfBtn").onclick=async()=>{
  const d=collect(),miss=[];if(!d.date)miss.push("التاريخ");if(!d.emp)miss.push("اسم الموظف");if(!d.cname)miss.push("اسم الزبون");
  if(miss.length){dialog(`<h3>حقول ناقصة</h3><p>يرجى ملء: ${miss.join("، ")}</p><div class="row"><button class="btn pri" onclick="closeDlg()">حسناً</button></div>`);return;}
  dialog(`<div class="spin"></div><p style="text-align:center">جاري إنشاء التقرير...</p>`);
  try{
    lastPdf=await makeReport();
    const kb=Math.round(lastPdf.blob.size/1024);
    dialog(`<h3>التقرير جاهز ✓</h3><p>${lastPdf.name}<br>الحجم: ${kb>1024?(kb/1024).toFixed(1)+" ميغابايت":kb+" كيلوبايت"}</p>
      <div class="row"><button class="btn pri" id="svBtn">💾 حفظ في الجهاز</button><button class="btn sec" onclick="closeDlg()">إغلاق</button></div>`);
    $("svBtn").onclick=savePdf;
  }catch(e){console.error(e);dialog(`<h3>حدث خطأ</h3><p>تعذّر إنشاء التقرير. حاول تقليل عدد الصور.</p><div class="row"><button class="btn pri" onclick="closeDlg()">حسناً</button></div>`);}
};
$("newBtn").onclick=()=>{
  dialog(`<h3>بدء تقرير جديد؟</h3><p>سيتم مسح جميع البيانات والصور الحالية.</p><div class="row"><button class="btn pri" id="okNew">نعم، تقرير جديد</button><button class="btn sec" onclick="closeDlg()">إلغاء</button></div>`);
  $("okNew").onclick=()=>{FIELDS.forEach(f=>$(f).value="");itemsEl.querySelectorAll("input").forEach(x=>x.value="");Object.keys(photos).forEach(k=>{photos[k]=[];renderSec(k);});$("date").value=today();saveDraft();closeDlg();window.scrollTo(0,0);};
};
$("ov").onclick=e=>{if(e.target.id=="ov"&&!$("dlg").querySelector(".spin"))closeDlg();};
loadDraft();if(!$("date").value)$("date").value=today();
try{if("serviceWorker" in navigator&&location.protocol=="https:"&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register("sw.js");}catch(e){}
</script>
